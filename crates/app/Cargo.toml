[package]
name = "photoorg-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "photo-organize"
path = "src/main.rs"

[dependencies]
photoorg-core.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
crossbeam-channel.workspace = true
rayon.workspace = true
eframe = "0.37"
rfd = "0.17"
fontique = "0.11"
dirs = "7"
# Licence registration (설정 → 라이선스): HTTPS to the sales site, and an offline check of the
# signed token it returns.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
ring = "0.17"
machine-uid = "0.6"
blake3 = "1"

# Embeds assets/icon.ico (and version info) into photo-organize.exe.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
