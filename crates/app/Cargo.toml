[package]
name = "photoorg-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "photo-organize"
path = "src/main.rs"

[dependencies]
photoorg-core.workspace = true
photoorg-macos.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
crossbeam-channel.workspace = true
rayon.workspace = true
eframe = "0.37"
rfd = "0.17"
fontique = "0.11"
dirs = "7"
# Licence registration (설정 → 라이선스): HTTPS to the sales site, and an offline check of the
# signed token it returns. Only in the website build (feature "license").
ureq = { version = "3", default-features = false, features = ["rustls", "json"], optional = true }
ring = { version = "0.17", optional = true }
machine-uid = { version = "0.6", optional = true }
blake3 = { version = "1", optional = true }

[features]
default = ["license"]
# The website build registers keys bought on the sales site. The Mac App Store build is sold by
# Apple and leaves this out (`--no-default-features`): no license keys there (App Review 2.4.5,
# 3.1.1), and no network access at all.
license = ["dep:ureq", "dep:ring", "dep:machine-uid", "dep:blake3"]

# Embeds assets/icon.ico (and version info) into photo-organize.exe.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
