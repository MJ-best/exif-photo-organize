name: ios-app-store

# Build the iOS / iPadOS App Store .ipa and, if asked, upload it to App Store Connect.
# Run it by hand: Actions → ios-app-store → Run workflow.
#
# Reuses the existing Apple Developer / App Store Connect repository secrets from Mac App Store:
#   MAS_APP_CERT_P12          base64 of the "Apple Distribution" certificate (.p12)
#                             (or optional IOS_APP_CERT_P12 if kept separate)
#   MAS_CERT_PASSWORD         password of the .p12 file (or optional IOS_CERT_PASSWORD)
#   APPLE_TEAM_ID             10-character Apple Developer Team ID
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8   App Store Connect API key (.p8 file contents)
# Optional:
#   IOS_PROVISIONING_PROFILE  base64 of the iOS App Store provisioning profile (.mobileprovision).
#                             When omitted, Xcode uses automatic distribution signing via ASC_* API key.
#   vars.IOS_BUNDLE_ID        default io.github.mj-best.loupe (Universal Purchase with Mac App Store)

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "App Store Connect 에 올리기 (끄면 서명된 .ipa 만 아티팩트로 만듦)"
        type: boolean
        default: true
      bundle_id:
        description: "번들 ID (기본값 io.github.mj-best.loupe = 맥과 통합 구매)"
        type: string
        default: "io.github.mj-best.loupe"
  # Dry run (unsigned Release arm64 archive + ITMS preflight verification) on PRs touching iOS packaging.
  pull_request:
    paths:
      - "ios/**"
      - "crates/ios/**"
      - "crates/core/**"
      - "crates/cull/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ios-app-store.yml"

permissions:
  contents: read

jobs:
  ios-appstore:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-appstore

      - name: Select newest non-beta Xcode
        run: |
          latest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)"
          if [[ -n "$latest" ]]; then sudo xcode-select -s "$latest/Contents/Developer"; fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Dry run (unsigned Release arm64 archive + ITMS checks)
        if: github.event_name == 'pull_request'
        env:
          BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'io.github.mj-best.loupe' }}
          BUILD: ${{ github.run_number }}
        run: ios/Scripts/ios-appstore.sh --dry-run

      - name: Import Apple Distribution certificate, optional profile, and ASC API key
        if: github.event_name != 'pull_request'
        env:
          IOS_APP_CERT_P12: ${{ secrets.IOS_APP_CERT_P12 }}
          MAS_APP_CERT_P12: ${{ secrets.MAS_APP_CERT_P12 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          MAS_CERT_PASSWORD: ${{ secrets.MAS_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          CERT_P12="${IOS_APP_CERT_P12:-$MAS_APP_CERT_P12}"
          CERT_PW="${IOS_CERT_PASSWORD:-$MAS_CERT_PASSWORD}"
          : "${CERT_P12:?set MAS_APP_CERT_P12 or IOS_APP_CERT_P12}"
          : "${CERT_PW:?set MAS_CERT_PASSWORD or IOS_CERT_PASSWORD}"
          : "${ASC_KEY_ID:?set ASC_KEY_ID}"
          : "${ASC_KEY_P8:?set ASC_KEY_P8}"

          KEYCHAIN="$RUNNER_TEMP/ios-appstore.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$CERT_PW" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dist.p12"

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"

          APP_ID_LINE="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -m1 'Apple Distribution' | sed -E 's/.*"(.*)"/\1/')"
          echo "APP_IDENTITY=$APP_ID_LINE" >> "$GITHUB_ENV"

          if [[ -n "$IOS_PROVISIONING_PROFILE" ]]; then
            echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/ios-appstore.mobileprovision"
            echo "PROFILE=$RUNNER_TEMP/ios-appstore.mobileprovision" >> "$GITHUB_ENV"
          fi

          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Build, sign, package (and upload) iOS/iPadOS App Store IPA
        if: github.event_name != 'pull_request'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ inputs.bundle_id || vars.IOS_BUNDLE_ID || 'io.github.mj-best.loupe' }}
          BUILD: ${{ github.run_number }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [[ "${{ inputs.upload }}" == "true" ]]; then
            ios/Scripts/ios-appstore.sh --upload
          else
            ios/Scripts/ios-appstore.sh
          fi

      - name: Clean up temporary keychain & private key
        if: always() && github.event_name != 'pull_request'
        run: |
          security delete-keychain "$RUNNER_TEMP/ios-appstore.keychain-db" 2>/dev/null || true
          rm -rf ~/.appstoreconnect/private_keys "$RUNNER_TEMP/ios-appstore.mobileprovision"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && 'loupe-ios-appstore-dry-run' || 'loupe-ios-appstore' }}
          path: |
            dist-ios-appstore/*.ipa
            dist-ios-appstore/*.xcarchive.zip
