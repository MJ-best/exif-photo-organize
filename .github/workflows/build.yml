name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
          - os: macos-13
            name: macos-x86_64
          - os: windows-latest
            name: windows-x86_64
          - os: ubuntu-latest
            name: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Build
        run: cargo build --release --workspace
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          ./scripts/macos-bundle.sh target/release/photo-organize dist
          cp target/release/photoorg dist/
          cd dist && zip -qry "../photo-organize-${{ matrix.name }}.zip" .
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/photo-organize.exe, target/release/photoorg.exe dist/
          Compress-Archive -Path dist/* -DestinationPath "photo-organize-${{ matrix.name }}.zip"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir dist && cp target/release/photo-organize target/release/photoorg dist/
          tar -czf "photo-organize-${{ matrix.name }}.tar.gz" -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: photo-organize-${{ matrix.name }}
          path: photo-organize-${{ matrix.name }}.*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: photo-organize-${{ matrix.name }}.*
