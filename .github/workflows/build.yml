name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "릴리스로 만들 태그 (예: v0.1.0). 비워 두면 빌드만 합니다. 릴리스 노트는 docs/releases/<태그>.md"
        required: false
        default: ""
      release_target:
        description: "태그를 붙일 커밋 SHA 또는 브랜치 (비워 두면 실행한 커밋)"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always

# Needed to create the GitHub release (see the plan job).
permissions:
  contents: write

jobs:
  # Decide whether this run publishes a release, and under which tag:
  #  - pushing a v* tag                      -> that tag
  #  - manual run with release_tag           -> that tag (created through the API)
  #  - push to main with a new version whose release notes exist
  #    (docs/releases/v<Cargo version>.md) -> v<version>, created automatically
  #  - push to main whose version's release exists but lacks some of the 4 files (an upload
  #    failed)                               -> v<version> again, to finish it
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      target: ${{ steps.plan.outputs.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_TARGET: ${{ inputs.release_target }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=""
          target="$GITHUB_SHA"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
            target="${INPUT_TARGET:-$GITHUB_SHA}"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            version="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
            if [[ -f "docs/releases/v$version.md" ]]; then
              if ! git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
                tag="v$version"
              else
                # dmg + zip (macOS), Windows zip, Linux tar.gz. Unknown -> assume complete.
                assets="$(gh release view "v$version" --json assets --jq '.assets | length' 2>/dev/null || echo 4)"
                if (( assets < 4 )); then
                  echo "release v$version has only $assets of 4 files: finishing it"
                  tag="v$version"
                fi
              fi
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "release tag: ${tag:-<none>}  target: $target"

  # macOS first: one universal app that runs on Apple Silicon and Intel MacBooks.
  macos:
    needs: plan
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-universal
      - name: Test
        run: |
          cargo test --workspace
          # The Mac App Store flavour (sandboxed, no license keys): scripts/macos-appstore.sh
          cargo test -p photoorg-app --no-default-features
      - name: Build (arm64 + x86_64)
        run: |
          # The Android bridge is built by android.yml.
          cargo build --release --workspace --exclude photoorg-android --target aarch64-apple-darwin
          cargo build --release --workspace --exclude photoorg-android --target x86_64-apple-darwin
      - name: Universal binaries
        run: |
          mkdir -p target/universal
          for b in photo-organize photoorg; do
            lipo -create \
              target/aarch64-apple-darwin/release/$b \
              target/x86_64-apple-darwin/release/$b \
              -output target/universal/$b
          done
          lipo -info target/universal/photo-organize
      - name: Bundle .app, zip and dmg
        env:
          # Optional (README "macOS 공증"): without them the app is only ad-hoc signed and macOS
          # asks the user to allow it once.
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ./scripts/macos-bundle.sh target/universal/photo-organize dist
          # Developer ID signature + notarization when the secrets exist, ad-hoc otherwise
          # (ad-hoc is still needed so Apple Silicon accepts the merged binary).
          ./scripts/macos-sign.sh "dist/Photo Organize.app"
          cp target/universal/photoorg dist/
          ditto -c -k --keepParent "dist/Photo Organize.app" photo-organize-macos-universal.zip
          mkdir dmg && cp -R "dist/Photo Organize.app" dmg/ && ln -s /Applications dmg/Applications
          # hdiutil's own size estimate is too tight for the larger binary (embedded models in
          # both architectures) and fails with "No space left on device": give it headroom.
          size_mb=$(( $(du -sm dmg | cut -f1) * 12 / 10 + 20 ))
          hdiutil create -volname "Photo Organize" -srcfolder dmg -size "${size_mb}m" -ov -format UDZO photo-organize-macos-universal.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: photo-organize-macos-universal
          path: |
            photo-organize-macos-universal.dmg
            photo-organize-macos-universal.zip
      - name: Release
        if: needs.plan.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ./scripts/release-upload.sh "${{ needs.plan.outputs.tag }}" "${{ needs.plan.outputs.target }}" \
            photo-organize-macos-universal.dmg photo-organize-macos-universal.zip

  # Windows / Linux run after the macOS build (even if it failed).
  others:
    needs: [plan, macos]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
          - os: ubuntu-latest
            name: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Build
        run: cargo build --release --workspace --exclude photoorg-android
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/photo-organize.exe, target/release/photoorg.exe dist/
          Compress-Archive -Path dist/* -DestinationPath "photo-organize-${{ matrix.name }}.zip"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir dist && cp target/release/photo-organize target/release/photoorg dist/
          tar -czf "photo-organize-${{ matrix.name }}.tar.gz" -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: photo-organize-${{ matrix.name }}
          path: photo-organize-${{ matrix.name }}.*
      - name: Release
        if: needs.plan.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ./scripts/release-upload.sh "${{ needs.plan.outputs.tag }}" "${{ needs.plan.outputs.target }}" \
            photo-organize-${{ matrix.name }}.*
