name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Needed to create the GitHub release on tag pushes.
permissions:
  contents: write

jobs:
  # macOS first: one universal app that runs on Apple Silicon and Intel MacBooks.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-universal
      - name: Test
        run: cargo test --workspace
      - name: Build (arm64 + x86_64)
        run: |
          cargo build --release --workspace --target aarch64-apple-darwin
          cargo build --release --workspace --target x86_64-apple-darwin
      - name: Universal binaries
        run: |
          mkdir -p target/universal
          for b in photo-organize photoorg; do
            lipo -create \
              target/aarch64-apple-darwin/release/$b \
              target/x86_64-apple-darwin/release/$b \
              -output target/universal/$b
          done
          lipo -info target/universal/photo-organize
      - name: Bundle .app, zip and dmg
        run: |
          ./scripts/macos-bundle.sh target/universal/photo-organize dist
          # Ad-hoc signature so Apple Silicon accepts the merged binary.
          codesign --force --deep --sign - "dist/Photo Organize.app"
          codesign --verify --verbose "dist/Photo Organize.app"
          cp target/universal/photoorg dist/
          ditto -c -k --keepParent "dist/Photo Organize.app" photo-organize-macos-universal.zip
          mkdir dmg && cp -R "dist/Photo Organize.app" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Photo Organize" -srcfolder dmg -ov -format UDZO photo-organize-macos-universal.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: photo-organize-macos-universal
          path: |
            photo-organize-macos-universal.dmg
            photo-organize-macos-universal.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Photo Organize ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          files: |
            photo-organize-macos-universal.dmg
            photo-organize-macos-universal.zip

  # Windows / Linux run after the macOS build (even if it failed).
  others:
    needs: macos
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
          - os: ubuntu-latest
            name: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Build
        run: cargo build --release --workspace
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/photo-organize.exe, target/release/photoorg.exe dist/
          Compress-Archive -Path dist/* -DestinationPath "photo-organize-${{ matrix.name }}.zip"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir dist && cp target/release/photo-organize target/release/photoorg dist/
          tar -czf "photo-organize-${{ matrix.name }}.tar.gz" -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: photo-organize-${{ matrix.name }}
          path: photo-organize-${{ matrix.name }}.*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Photo Organize ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          files: photo-organize-${{ matrix.name }}.*
