name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "릴리스로 만들 태그 (예: v0.1.0). 비워 두면 빌드만 합니다. 릴리스 노트는 docs/releases/<태그>.md"
        required: false
        default: ""
      release_target:
        description: "태그를 붙일 커밋 SHA 또는 브랜치 (비워 두면 실행한 커밋)"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always

# Needed to create the GitHub release (see the plan job).
permissions:
  contents: write

jobs:
  # Decide whether this run publishes a release, and under which tag:
  #  - pushing a v* tag                      -> that tag
  #  - manual run with release_tag           -> that tag (created through the API)
  #  - push to main with a new version whose release notes exist
  #    (docs/releases/v<Cargo version>.md) -> v<version>, created automatically
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      target: ${{ steps.plan.outputs.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_TARGET: ${{ inputs.release_target }}
        run: |
          tag=""
          target="$GITHUB_SHA"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
            target="${INPUT_TARGET:-$GITHUB_SHA}"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            version="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
            if [[ -f "docs/releases/v$version.md" ]] && ! git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
              tag="v$version"
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "release tag: ${tag:-<none>}  target: $target"

  # macOS first: one universal app that runs on Apple Silicon and Intel MacBooks.
  macos:
    needs: plan
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-universal
      - name: Test
        run: cargo test --workspace
      - name: Build (arm64 + x86_64)
        run: |
          cargo build --release --workspace --target aarch64-apple-darwin
          cargo build --release --workspace --target x86_64-apple-darwin
      - name: Universal binaries
        run: |
          mkdir -p target/universal
          for b in photo-organize photoorg; do
            lipo -create \
              target/aarch64-apple-darwin/release/$b \
              target/x86_64-apple-darwin/release/$b \
              -output target/universal/$b
          done
          lipo -info target/universal/photo-organize
      - name: Bundle .app, zip and dmg
        run: |
          ./scripts/macos-bundle.sh target/universal/photo-organize dist
          # Ad-hoc signature so Apple Silicon accepts the merged binary.
          codesign --force --deep --sign - "dist/Photo Organize.app"
          codesign --verify --verbose "dist/Photo Organize.app"
          cp target/universal/photoorg dist/
          ditto -c -k --keepParent "dist/Photo Organize.app" photo-organize-macos-universal.zip
          mkdir dmg && cp -R "dist/Photo Organize.app" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Photo Organize" -srcfolder dmg -ov -format UDZO photo-organize-macos-universal.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: photo-organize-macos-universal
          path: |
            photo-organize-macos-universal.dmg
            photo-organize-macos-universal.zip
      - name: Release
        if: needs.plan.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ needs.plan.outputs.target }}
          name: Photo Organize ${{ needs.plan.outputs.tag }}
          body_path: docs/releases/${{ needs.plan.outputs.tag }}.md
          fail_on_unmatched_files: true
          files: |
            photo-organize-macos-universal.dmg
            photo-organize-macos-universal.zip

  # Windows / Linux run after the macOS build (even if it failed).
  others:
    needs: [plan, macos]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
          - os: ubuntu-latest
            name: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Build
        run: cargo build --release --workspace
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/photo-organize.exe, target/release/photoorg.exe dist/
          Compress-Archive -Path dist/* -DestinationPath "photo-organize-${{ matrix.name }}.zip"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir dist && cp target/release/photo-organize target/release/photoorg dist/
          tar -czf "photo-organize-${{ matrix.name }}.tar.gz" -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: photo-organize-${{ matrix.name }}
          path: photo-organize-${{ matrix.name }}.*
      - name: Release
        if: needs.plan.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ needs.plan.outputs.target }}
          name: Photo Organize ${{ needs.plan.outputs.tag }}
          body_path: docs/releases/${{ needs.plan.outputs.tag }}.md
          fail_on_unmatched_files: true
          files: photo-organize-${{ matrix.name }}.*
