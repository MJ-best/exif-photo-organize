name: android

# The Android app (android/): engine tests through the Kotlin bindings, screenshots of the
# screens, and the Play bundle. Signed with the upload key when its secrets exist:
#   ANDROID_KEYSTORE_BASE64   base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# See docs/play-store/README.md.

on:
  push:
    branches: [main]
    paths: ["android/**", "crates/**", "Cargo.lock", "Cargo.toml", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "crates/**", "Cargo.lock", "Cargo.toml", ".github/workflows/android.yml"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: 28.2.13676358

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Robolectric runs Android 16 (SDK 36) only on Java 21+.
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION" > /dev/null
          cargo install cargo-ndk --locked
      - name: Engine tests (Rust)
        run: cargo test -p photoorg-android -p photoorg-core
      - name: App tests and screenshots
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Upload key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE != ''
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Play bundle and APKs
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # A higher build number for a re-upload of the same version: run with versionCode set.
          VERSION_CODE: ${{ vars.ANDROID_VERSION_CODE }}
        run: |
          ./gradlew --no-daemon :app:bundleRelease :app:assembleDebug ${VERSION_CODE:+-PversionCode=$VERSION_CODE}
      - uses: actions/upload-artifact@v4
        with:
          name: photo-organize-android
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screenshots
          path: android/app/build/outputs/roborazzi/
