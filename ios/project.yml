name: Loupe
options:
  bundleIdPrefix: io.github.mj-best
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Release

settings:
  base:
    MARKETING_VERSION: "0.7.4"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    ENABLE_BITCODE: NO
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_USER_SCRIPT_SANDBOXING: NO
  configs:
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: -O
      STRIP_INSTALLED_PRODUCT: YES

targets:
  Loupe:
    type: application
    platform: iOS
    sources:
      - path: Loupe
      - path: Generated/photoorg_ios.swift
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mj-best.loupe.ios
        INFOPLIST_FILE: Config/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: ""
        CODE_SIGN_STYLE: Automatic
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lc++"
          - "-lz"
    dependencies:
      - framework: Generated/LoupeCore.xcframework
        embed: false
        link: true

  LoupeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LoupeTests
    dependencies:
      - target: Loupe

schemes:
  Loupe:
    build:
      targets:
        Loupe: all
        LoupeTests: [test]
    test:
      targets:
        - LoupeTests
    archive:
      config: Release
