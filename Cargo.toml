[workspace]
resolver = "2"
members = ["crates/cull", "crates/core", "crates/app", "crates/cli", "crates/macos", "crates/android"]

[workspace.package]
version = "0.6.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/MJ-best/exif-photo-organize"

[workspace.dependencies]
photoorg-core = { path = "crates/core" }
photoorg-cull = { path = "crates/cull" }
photoorg-macos = { path = "crates/macos" }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
crossbeam-channel = "0.5"
rayon = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# Image decoding is painfully slow in debug builds; optimise dependencies even in dev.
[profile.dev.package."*"]
opt-level = 3
